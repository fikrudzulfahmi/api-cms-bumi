; ---------------------------------------------------------------------------
; Batas unggah untuk CMS Bumi (MA Bustanul Muta'allimin).
;
; Kenapa berkas ini ada:
;   Default cPanel (upload_max_filesize = 2M, post_max_size = 8M) membuat foto
;   dari kamera HP (3-8 MB) gagal terunggah dengan pesan "The file failed to
;   upload." — PHP menolaknya SEBELUM kode aplikasi sempat berjalan.
;
; Cara kerja:
;   .user.ini dibaca oleh PHP-FPM di folder dokumen (public/) dan menimpa
;   pengaturan bawaan server. Ikut ter-deploy otomatis karena ada di dalam repo.
;
; Catatan: post_max_size WAJIB lebih besar daripada upload_max_filesize.
; ---------------------------------------------------------------------------

upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
