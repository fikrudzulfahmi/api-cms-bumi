name: Deploy API (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          echo "::warning title=KEY INFO::len=${#RAW} baris=$(printf '%s' "$RAW" | wc -l) md5=$(printf '%s' "$RAW" | md5sum | cut -d' ' -f1)"

          try_key() { printf '%s\n' "$1" > /tmp/kt; chmod 600 /tmp/kt; ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; }
          OK=0
          if try_key "$RAW"; then cp /tmp/kt ~/.ssh/deploy_key; OK=1; fi
          if [ "$OK" = 0 ] && printf '%s' "$RAW" | tr -d '\n\r ' | base64 -d > /tmp/kd 2>/dev/null && try_key "$(cat /tmp/kd)"; then cp /tmp/kd ~/.ssh/deploy_key; OK=1; fi
          if [ "$OK" = 0 ]; then
            CLEAN=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//g' -e 's/-----END OPENSSH PRIVATE KEY-----//g' | tr -d ' \t\n\r')
            { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$CLEAN" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > /tmp/kr
            printf '\n' >> /tmp/kr
            if try_key "$(cat /tmp/kr)"; then cp /tmp/kr ~/.ssh/deploy_key; OK=1; fi
          fi
          [ "$OK" = 1 ] || { echo "::error title=SSH_KEY RUSAK::Secret SSH_KEY tidak valid."; exit 1; }
          chmod 600 ~/.ssh/deploy_key
          echo "::notice title=SSH_KEY OK::pubkey md5=$(ssh-keygen -y -f ~/.ssh/deploy_key | md5sum | cut -c1-12)"

          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "whoami && hostname" 2>&1); then
            echo "::notice title=SSH TERHUBUNG::$(printf '%s' "$OUT" | tr '\n' ' ')"
          else
            echo "::error title=SSH GAGAL::$(printf '%s' "$OUT" | tr '\n' '|')"; exit 1
          fi

          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            .github/scripts/backend_deploy.sh "$SSH_USER@$SSH_HOST:~/cms_bumi_deploy.sh"

          if OUT2=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash ~/cms_bumi_deploy.sh" 2>&1); then
            echo "::notice title=DEPLOY BACKEND OK::$(printf '%s' "$OUT2" | tr '\n' '|' | tail -c 900)"
          else
            echo "::error title=DEPLOY GAGAL::$(printf '%s' "$OUT2" | tr '\n' '|' | tail -c 900)"
            ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -f ~/cms_bumi_deploy.sh" 2>/dev/null || true
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -f ~/cms_bumi_deploy.sh" 2>/dev/null || true
