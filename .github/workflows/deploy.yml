name: Deploy API (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          echo "================= DIAGNOSTIK SECRET ================="
          echo "SSH_HOST   = [$SSH_HOST]"
          echo "SSH_USER   = [$SSH_USER]"
          echo "SSH_PORT   = [$PORT]"
          echo "DEPLOY_PATH= [$DEPLOY_PATH]"
          echo "SSH_KEY    : panjang=${#SSH_KEY} huruf, baris=$(printf '%s' "$SSH_KEY" | wc -l)"
          echo "SSH_KEY    : awal -> $(printf '%s' "$SSH_KEY" | head -c 40)"
          echo "====================================================="

          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "================= TES KONEKSI SSH ================="
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "echo TERHUBUNG sebagai \$(whoami) di \$(hostname)"
          echo "==================================================="

          echo "================= DEPLOY APLIKASI ================="
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -e
          cd '$DEPLOY_PATH'
          echo "--- lokasi: \$(pwd) ---"
          git pull origin main
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan route:clear && php artisan route:cache
          php artisan config:clear && php artisan config:cache
          php artisan storage:link 2>/dev/null || true
          echo "--- deploy selesai ---"
          REMOTE
          echo "===================== SELESAI ====================="
