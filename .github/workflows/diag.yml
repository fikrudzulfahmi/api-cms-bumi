name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostik render root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:/opt/cpanel/composer/bin:$PATH"
          cd "$DEPLOY_PATH" || exit 1

          cat > probe_diag.php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          echo "== APP ==\n";
          echo "env=".config('app.env')." debug=".(config('app.debug') ? 'true' : 'false')." key=".(config('app.key') ? 'ADA' : 'KOSONG')."\n";
          echo "cms.nama=".var_export(config('cms.nama'), true)."\n";
          echo "cms.frontend_url=".var_export(config('cms.frontend_url'), true)."\n";

          echo "== RENDER VIEW backend-home ==\n";
          try {
              $out = view('backend-home', ['nama' => 'UJI', 'versi' => 'x', 'lingkungan' => 'local'])->render();
              echo "OK panjang=".strlen($out)."\n";
          } catch (\Throwable $e) {
              echo "GAGAL: ".get_class($e).": ".$e->getMessage()."\n";
              echo "  di ".$e->getFile().":".$e->getLine()."\n";
          }

          echo "== HANDLE REQUEST / ==\n";
          try {
              $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
              $req = Illuminate\Http\Request::create('/', 'GET');
              $res = $kernel->handle($req);
              echo "status=".$res->getStatusCode()." panjang=".strlen($res->getContent())."\n";
          } catch (\Throwable $e) {
              echo "GAGAL: ".get_class($e).": ".$e->getMessage()."\n";
              echo "  di ".$e->getFile().":".$e->getLine()."\n";
          }
          PHP

          php probe_diag.php 2>&1 | head -40
          rm -f probe_diag.php
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
