name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan migrasi domain ma-bumi.sch.id
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          echo "== 1. DOCROOT DOMAIN SEKARANG =="
          for d in ma-bumi.sch.id apicms.ma-bumi.sch.id api-bumi.backupmate.biz.id; do
            echo "  --- $d ---"
            uapi DomainInfo single_domain_data domain=$d 2>&1 | grep -iE "documentroot|servername|^ *type" | head -3 | sed 's/^/    /'
          done

          echo "== 2. DAFTARKAN SUBDOMAIN apicms (docroot ke folder public) =="
          uapi SubDomain addsubdomain domain=apicms rootdomain=ma-bumi.sch.id dir=apicms.ma-bumi.sch.id/public 2>&1 | head -14

          echo "== 3. DOCROOT SETELAH DIDAFTARKAN =="
          uapi DomainInfo single_domain_data domain=apicms.ma-bumi.sch.id 2>&1 | grep -iE "documentroot|servername" | head -3 | sed 's/^/    /'

          echo "== 4. SALIN BACKEND ke folder baru =="
          if [ -f "$HOME/apicms.ma-bumi.sch.id/artisan" ]; then
            echo "  sudah ada artisan — salinan dilewati"
          else
            rm -rf "$HOME/apicms.ma-bumi.sch.id"/* "$HOME/apicms.ma-bumi.sch.id"/.[!.]* 2>/dev/null || true
            cp -a "$HOME/api-cms-bumi/." "$HOME/apicms.ma-bumi.sch.id/" && echo "  BERHASIL disalin"
          fi
          ls -1 "$HOME/apicms.ma-bumi.sch.id" | head -10 | sed 's/^/    /'

          echo "== 5. PERBAIKI .env SALINAN =="
          E="$HOME/apicms.ma-bumi.sch.id/.env"
          if [ -f "$E" ]; then
            sed -i 's#^APP_URL=.*#APP_URL=https://apicms.ma-bumi.sch.id#' "$E"
            if grep -q '^FRONTEND_URL=' "$E"; then
              sed -i 's#^FRONTEND_URL=.*#FRONTEND_URL=https://ma-bumi.sch.id#' "$E"
            else
              echo 'FRONTEND_URL=https://ma-bumi.sch.id' >> "$E"
            fi
            grep -E '^(APP_URL|FRONTEND_URL|APP_ENV|APP_DEBUG)=' "$E" | sed 's/^/    /'
          else
            echo "    .env TIDAK ADA di salinan!"
          fi

          echo "== 6. ISI FOLDER FRONTEND =="
          ls -la "$HOME/ma-bumi.sch.id" | head -8 | sed 's/^/    /'

          echo "== 7. JALANKAN AUTOSSL =="
          uapi SSL start_autossl_check 2>&1 | grep -iE "status|message" | head -3 | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
