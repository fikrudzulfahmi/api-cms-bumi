name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Alasan AutoSSL
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/k
          printf '\n' >> ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH="ssh -i ~/.ssh/k -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes $SSH_USER@$SSH_HOST"

          OUT=$($SSH "/usr/local/cpanel/bin/autossl_check --user=\$USER 2>&1 | tail -30" || true)
          echo "::warning title=1-AUTOSSL_CHECK::$OUT"

          OUT=$($SSH "uapi SSL start_autossl_check --output=json 2>&1 | head -c 500" || true)
          echo "::warning title=2-START_AUTOSSL::$OUT"

          OUT=$($SSH "ls -t ~/.cpanel/logs 2>/dev/null | head -5; echo '---'; tail -25 ~/.cpanel/logs/autossl*.log 2>/dev/null" || true)
          echo "::warning title=3-LOG_USER::$OUT"

          OUT=$($SSH "ls -t /usr/local/cpanel/logs 2>/dev/null | grep -i -E 'autossl|ssl' | head -5" || true)
          echo "::warning title=4-LOG_ROOT::$OUT"

          OUT=$($SSH "uapi DomainInfo single_domain_data domain=bumi.backupmate.biz.id --output=json 2>&1 | tr '\n' ' ' | head -c 900" || true)
          echo "::warning title=5-DOMAIN_DATA::$OUT"
