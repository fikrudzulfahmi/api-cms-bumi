name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pulihkan backend apicms + pasang jembatan ke /public
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NEW="$HOME/apicms.ma-bumi.sch.id"
          SRC="$HOME/api-cms-bumi"

          echo "== 1. DI MANA REPO SEKARANG =="
          for d in "$NEW" "$HOME/_apicms_lama" "$SRC"; do
            if [ -e "$d" ]; then
              echo "    ADA   $(basename "$d") -> $(ls -1 "$d" 2>/dev/null | wc -l) isi | artisan: $([ -f "$d/artisan" ] && echo YA || echo tidak)"
            else
              echo "    TIDAK $(basename "$d")"
            fi
          done

          echo "== 2. PASTIKAN REPO ADA DI DOCROOT =="
          mkdir -p "$NEW"
          if [ ! -f "$NEW/artisan" ]; then
            if [ -f "$HOME/_apicms_lama/artisan" ]; then
              cp -a "$HOME/_apicms_lama/." "$NEW/" && echo "    disalin dari _apicms_lama"
            else
              cp -a "$SRC/." "$NEW/" && echo "    disalin dari api-cms-bumi"
            fi
          else
            echo "    artisan sudah ada — dilewati"
          fi
          echo "    isi sekarang: $(ls -1 "$NEW" | wc -l) item | artisan: $([ -f "$NEW/artisan" ] && echo YA || echo TIDAK)"

          echo "== 3. .env =="
          E="$NEW/.env"
          sed -i 's#^APP_URL=.*#APP_URL=https://apicms.ma-bumi.sch.id#' "$E"
          grep -q '^FRONTEND_URL=' "$E" && sed -i 's#^FRONTEND_URL=.*#FRONTEND_URL=https://ma-bumi.sch.id#' "$E" || echo 'FRONTEND_URL=https://ma-bumi.sch.id' >> "$E"
          grep -E '^(APP_URL|APP_ENV|APP_DEBUG|FRONTEND_URL)=' "$E" | sed 's/^/    /'

          echo "== 4. JEMBATAN KE /public (docroot tidak bisa diubah via API) =="
          cat > "$NEW/.htaccess" <<'HT'
          # Docroot menunjuk ke root repo. Teruskan semua permintaan ke public/
          # supaya .env & kode sumber tidak bisa diakses dari web.
          # (Kalau docroot kelak diarahkan ke /public, berkas ini tidak terpakai.)
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/public/
            RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          <FilesMatch "^\.">
            Require all denied
          </FilesMatch>
          HT
          chmod 644 "$NEW/.htaccess"
          echo "    .htaccess ditulis"

          echo "== 5. BERSIHKAN CACHE LAMA + BANGUN ULANG =="
          cd "$NEW" || exit 1
          php artisan config:clear >/dev/null 2>&1; php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1
          php artisan storage:link 2>&1 | tail -1 | sed 's/^/    /'
          php artisan config:cache 2>&1 | tail -1 | sed 's/^/    /'
          php artisan route:cache  2>&1 | tail -1 | sed 's/^/    /'

          echo "== 6. NILAI KONFIG APLIKASI BARU =="
          php artisan tinker --execute="echo 'app.url='.config('app.url').PHP_EOL; echo 'frontend='.config('cms.frontend_url').PHP_EOL;" 2>&1 | tail -3 | sed 's/^/    /'

          echo "== 7. UJI ENDPOINT =="
          for u in "https://apicms.ma-bumi.sch.id/" "https://apicms.ma-bumi.sch.id/api/settings" "https://apicms.ma-bumi.sch.id/.env" "https://apicms.ma-bumi.sch.id/artisan"; do
            echo "    $u -> HTTP $(curl -sk -o /dev/null -m 15 -w '%{http_code}' "$u" 2>/dev/null)"
          done

          echo "== 8. SUBDOMAIN TERDAFTAR =="
          uapi SubDomain list_subdomains 2>&1 | grep -iE "apicms" | head -3 | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
