name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: AutoSSL
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/k
          printf '\n' >> ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH="ssh -i ~/.ssh/k -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes $SSH_USER@$SSH_HOST"

          OUT=$($SSH "ls /usr/local/cpanel/bin 2>/dev/null | grep -i -E 'autossl|ssl' ; echo '===' ; uapi SSL start_autossl_check 2>&1 | head -c 600" || true)
          echo "::warning title=TOOLS+TRIGGER::$OUT"

          echo "menunggu AutoSSL 75s..."
          sleep 75

          for h in bumi.backupmate.biz.id api-bumi.backupmate.biz.id; do
            SUBJ=$(echo | timeout 12 openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | tr -d '\n' || true)
            echo "::warning title=CERT $h::$SUBJ"
          done
