name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostik backend root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:/opt/cpanel/composer/bin:$PATH"
          cd "$DEPLOY_PATH" || exit 1
          echo "== ADA FILE? =="
          for f in config/cms.php resources/views/backend-home.blade.php resources/views/errors/404.blade.php resources/views/components/error-page.blade.php; do
            [ -e "$f" ] && echo "  ADA   $f" || echo "  HILANG $f"
          done
          echo "== ROUTE =="
          php artisan route:list 2>&1 | grep -E "GET|POST" | head -5
          echo "== KELAS ADA? =="
          php -r "require 'vendor/autoload.php'; echo class_exists('App\\Http\\Controllers\\LandingController') ? '  class OK' : '  class TIDAK ADA';" 2>&1
          echo ""
          echo "== PESAN ERROR (log) =="
          grep -a "ERROR" storage/logs/laravel.log 2>/dev/null | tail -2 | cut -c1-320
          echo "== 3 BARIS PERTAMA EXCEPTION TERAKHIR =="
          grep -a -A3 "production.ERROR" storage/logs/laravel.log 2>/dev/null | tail -6 | cut -c1-320
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
