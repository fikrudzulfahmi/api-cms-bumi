name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Amankan docroot + setel ke /public
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NEW="$HOME/apicms.ma-bumi.sch.id"

          echo "== 1. SANGGAHAN DARURAT: kunci akses langsung ke berkas repo =="
          cat > "$NEW/.htaccess" <<'HT'
          # Docroot sedang menunjuk ke root repo (bukan /public).
          # Cegah .env & kode sumber terbaca lewat web.
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^(?!public/).* - [F,L]
          </IfModule>
          <FilesMatch "^\.">
            Require all denied
          </FilesMatch>
          HT
          chmod 644 "$NEW/.htaccess"
          echo "    .htaccess pelindung ditulis ($(wc -c < "$NEW/.htaccess") byte)"

          echo "== 2. UJI: apakah .env bisa diunduh dari luar? =="
          for u in "https://apicms.ma-bumi.sch.id/.env" "http://apicms.ma-bumi.sch.id/.env"; do
            code=$(curl -sk -o /dev/null -m 12 -w '%{http_code}' "$u" 2>/dev/null)
            echo "    $u -> HTTP $code"
          done

          echo "== 3. COBA SET DOCROOT lewat UAPI =="
          for fn in "Domain set_docroot" "DomainInfo set_docroot" "SubDomain set_docroot" "Domain update_docroot"; do
            mod=$(echo $fn | cut -d' ' -f1); f=$(echo $fn | cut -d' ' -f2)
            res=$(uapi $mod $f domain=apicms.ma-bumi.sch.id root=apicms.ma-bumi.sch.id/public 2>&1 | grep -E "^(result|  status|  errors|-)" | head -3 | tr '\n' ' ')
            echo "    $fn -> ${res:-(tidak ada respons)}"
          done

          echo "== 4. SUBDOMAIN YANG ADA =="
          uapi SubDomain list_subdomains 2>&1 | grep -iE "apicms|ma-bumi" | head -6 | sed 's/^/    /'

          echo "== 5. DOCROOT SAAT INI =="
          uapi DomainInfo single_domain_data domain=apicms.ma-bumi.sch.id 2>&1 | grep -iE "documentroot" | head -2 | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
