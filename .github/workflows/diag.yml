name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Buat ulang subdomain apicms dengan docroot benar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NEW="$HOME/apicms.ma-bumi.sch.id"
          BAK="$HOME/_apicms_repo_bak"

          echo "== 1. AMANKAN REPO (pindah keluar docroot) =="
          rm -rf "$BAK"; mkdir -p "$BAK"
          if [ -f "$NEW/artisan" ]; then
            cp -a "$NEW/." "$BAK/" && echo "    tersalin ke _apicms_repo_bak ($(ls -1 "$BAK" | wc -l) item)"
          fi

          echo "== 2. HAPUS SUBDOMAIN (respons penuh) =="
          uapi SubDomain delsubdomain domain=apicms rootdomain=ma-bumi.sch.id 2>&1 | grep -vE "^$" | head -12 | sed 's/^/    /'

          echo "== 3. BUAT ULANG dengan docroot /public (respons penuh) =="
          uapi SubDomain addsubdomain domain=apicms rootdomain=ma-bumi.sch.id dir=apicms.ma-bumi.sch.id/public 2>&1 | grep -vE "^$" | head -12 | sed 's/^/    /'

          echo "== 4. DOCROOT HASIL =="
          uapi DomainInfo single_domain_data domain=apicms.ma-bumi.sch.id 2>&1 | grep -iE "documentroot|servername" | head -3 | sed 's/^/    /'

          echo "== 5. KEMBALIKAN REPO =="
          if [ -f "$BAK/artisan" ]; then
            mkdir -p "$NEW"
            cp -a "$BAK/." "$NEW/" && echo "    dikembalikan"
          fi
          rm -f "$NEW/index.php"   # buang front-controller lama (tidak diperlukan bila docroot = /public)
          [ -f "$NEW/artisan" ] && echo "    artisan: ADA" || echo "    artisan: TIDAK ADA"

          echo "== 6. PERBAIKI SYMLINK storage + CACHE =="
          cd "$NEW" || exit 1
          rm -f public/storage
          php artisan storage:link 2>&1 | tail -1 | sed 's/^/    /'
          php artisan config:clear >/dev/null 2>&1; php artisan route:clear >/dev/null 2>&1; php artisan view:clear >/dev/null 2>&1
          php artisan config:cache 2>&1 | tail -1 | sed 's/^/    /'
          php artisan route:cache  2>&1 | tail -1 | sed 's/^/    /'
          ls -la public/storage 2>&1 | head -1 | sed 's/^/    /'

          echo "== 7. UJI (tunggu DNS/vhost 5 detik) =="
          sleep 5
          for u in "https://apicms.ma-bumi.sch.id/" "https://apicms.ma-bumi.sch.id/api/settings" "https://apicms.ma-bumi.sch.id/.env" "https://apicms.ma-bumi.sch.id/up"; do
            echo "    $u -> HTTP $(curl -sk -o /dev/null -m 15 -w '%{http_code}' "$u" 2>/dev/null)"
          done
          echo "== 8. HEADER =="
          curl -sk -D - -o /dev/null -m 15 https://apicms.ma-bumi.sch.id/ 2>/dev/null | grep -iE "^HTTP|powered|content-type" | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
