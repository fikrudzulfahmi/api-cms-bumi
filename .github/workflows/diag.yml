name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Betulkan docroot apicms ke /public + siapkan aplikasi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          BAK="$HOME/_apicms_bak"

          echo "== 1. PINDAHKAN REPO KE LUAR DOCROOT (sementara) =="
          rm -rf "$BAK"; mkdir -p "$BAK"
          if [ -d "$HOME/apicms.ma-bumi.sch.id" ]; then
            mv "$HOME/apicms.ma-bumi.sch.id" "$HOME/_apicms_lama" && echo "    folder lama dipindah"
          fi

          echo "== 2. HAPUS & BUAT ULANG SUBDOMAIN DENGAN DOCROOT /public =="
          uapi SubDomain delsubdomain domain=apicms rootdomain=ma-bumi.sch.id 2>&1 | grep -E "status|errors" | head -3 | sed 's/^/    /'
          uapi SubDomain addsubdomain domain=apicms rootdomain=ma-bumi.sch.id dir=apicms.ma-bumi.sch.id/public 2>&1 | grep -E "status|errors" | head -4 | sed 's/^/    /'

          echo "== 3. DOCROOT SEKARANG =="
          DC=$(uapi DomainInfo single_domain_data domain=apicms.ma-bumi.sch.id 2>&1 | grep -i documentroot | head -1)
          echo "    $DC"

          echo "== 4. KEMBALIKAN ISI REPO =="
          mkdir -p "$HOME/apicms.ma-bumi.sch.id"
          if [ -d "$HOME/_apicms_lama" ]; then
            mv "$HOME/_apicms_lama/." "$HOME/apicms.ma-bumi.sch.id/" 2>/dev/null
            rmdir "$HOME/_apicms_lama" 2>/dev/null
            echo "    isi repo dikembalikan"
          fi
          ls -1 "$HOME/apicms.ma-bumi.sch.id" | head -6 | sed 's/^/      /'

          echo "== 5. BERSIHKAN CACHE LAMA (salinan membawa config cache lama) =="
          cd "$HOME/apicms.ma-bumi.sch.id" || exit 1
          php artisan config:clear 2>&1 | tail -1 | sed 's/^/      /'
          php artisan route:clear  2>&1 | tail -1 | sed 's/^/      /'
          php artisan view:clear   2>&1 | tail -1 | sed 's/^/      /'
          php artisan storage:link 2>&1 | tail -1 | sed 's/^/      /'
          php artisan config:cache 2>&1 | tail -1 | sed 's/^/      /'
          php artisan route:cache  2>&1 | tail -1 | sed 's/^/      /'

          echo "== 6. NILAI PENTING DI APLIKASI BARU =="
          php artisan tinker --execute="echo config('app.url').PHP_EOL; echo config('cms.frontend_url').PHP_EOL;" 2>&1 | tail -3 | sed 's/^/      /'

          echo "== 7. UJI HALAMAN BACKEND LOKAL (via Host) =="
          for u in "https://apicms.ma-bumi.sch.id/" "https://apicms.ma-bumi.sch.id/api/settings"; do
            code=$(curl -sk -o /dev/null -m 12 -w '%{http_code}' "$u" 2>/dev/null)
            echo "    $u -> HTTP $code"
          done

          echo "== 8. CEK .env MASIH 403? =="
          echo "    /.env -> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/.env 2>/dev/null)"
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
