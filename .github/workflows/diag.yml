name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Cari API pengubah docroot + diagnosis rewrite
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NEW="$HOME/apicms.ma-bumi.sch.id"

          echo "== A. FUNGSI YANG TERSEDIA di modul Domain =="
          uapi Domain 2>&1 | head -25 | sed 's/^/    /'

          echo "== B. COBA SEMUA KANDIDAT (respons penuh) =="
          for call in "Domain set_docroot" "DomainInfo set_docroot" "SubDomain set_docroot" "Domain edit_docroot" "SubDomain edit_docroot"; do
            mod=$(echo $call | cut -d' ' -f1); fn=$(echo $call | cut -d' ' -f2)
            echo "    --- uapi $mod $fn ---"
            uapi $mod $fn domain=apicms.ma-bumi.sch.id root=apicms.ma-bumi.sch.id/public 2>&1 | grep -vE "^$" | head -8 | sed 's/^/      /'
          done

          echo "== C. UJI: APAKAH REWRITE DIBACA? (uji berkas statis & redirect) =="
          echo "halo-statisp" > "$NEW/uji-statis.txt"
          printf '%s\n' 'RewriteEngine On' 'RewriteRule ^uji-redirect$ /uji-statis.txt [R=302,L]' > "$NEW/uji-rewrite/.htaccess" 2>/dev/null || {
            mkdir -p "$NEW/uji-rewrite"; printf '%s\n' 'RewriteEngine On' 'RewriteRule ^uji-redirect$ /uji-statis.txt [R=302,L]' > "$NEW/uji-rewrite/.htaccess"; }
          echo "    /uji-statis.txt  -> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/uji-statis.txt)"
          echo "    /uji-redirect    -> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/uji-redirect)"
          echo "    /public/uji-statis.txt -> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/public/uji-statis.txt)"
          echo "    /index.php       -> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/index.php)"
          echo "    /public/index.php-> HTTP $(curl -sk -o /dev/null -m 12 -w '%{http_code}' https://apicms.ma-bumi.sch.id/public/index.php)"
          rm -f "$NEW/uji-statis.txt"; rm -rf "$NEW/uji-rewrite"

          echo "== D. BERKAS DI DOCROOT =="
          ls -la "$NEW" | head -12 | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
