name: Diagnostik cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang front-controller apicms + diagnosa
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          RAW=$(printf '%s' "$SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          printf '%s\n' "$RAW" > /tmp/kt; chmod 600 /tmp/kt
          if ssh-keygen -y -f /tmp/kt >/dev/null 2>&1; then cp /tmp/kt ~/.ssh/deploy_key; else
            echo "::error title=KEY::gagal"; exit 1; fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE' 2>&1
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          NEW="$HOME/apicms.ma-bumi.sch.id"
          cd "$NEW" || exit 1

          echo "== 1. BUAT FRONT CONTROLLER DI DOCROOT =="
          printf '%s\n' '<?php' '' '// Docroot menunjuk ke root repo (bukan /public).' '// Teruskan ke front controller Laravel yang sebenarnya.' '' "require __DIR__.'/public/index.php';" > index.php
          echo "    index.php dibuat ($(wc -c < index.php) byte)"

          cat > .htaccess <<'HT'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            # Berkas/folder yang benar-benar ada -> sajikan langsung
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            # Aset publik Laravel (symlink storage)
            RewriteRule ^storage/(.*)$ public/storage/$1 [L,NC]
            # Sisanya -> front controller
            RewriteRule ^ index.php [L]
          </IfModule>
          <FilesMatch "^\.">
            Require all denied
          </FilesMatch>
          HT
          echo "    .htaccess front-controller ditulis"

          echo "== 2. UJI =="
          for u in "https://apicms.ma-bumi.sch.id/" "https://apicms.ma-bumi.sch.id/api/settings" "https://apicms.ma-bumi.sch.id/.env" "https://apicms.ma-bumi.sch.id/up"; do
            echo "    $u -> HTTP $(curl -sk -o /dev/null -m 15 -w '%{http_code}' "$u" 2>/dev/null)"
          done

          echo "== 3. HEADER / (siapa yang menjawab) =="
          curl -sk -D - -o /dev/null -m 15 https://apicms.ma-bumi.sch.id/ 2>/dev/null | grep -iE "^HTTP|powered|content-type" | sed 's/^/    /'

          echo "== 4. ISI /api/settings =="
          curl -sk -m 15 https://apicms.ma-bumi.sch.id/api/settings 2>/dev/null | head -c 160 | sed 's/^/    /'

          echo "== 5. LOG LARAVEL (3 baris terakhir) =="
          tail -3 storage/logs/laravel.log 2>/dev/null | cut -c1-200 | sed 's/^/    /'

          echo "== 6. PUBLIC/.htaccess ADA? =="
          [ -f public/.htaccess ] && echo "    ADA ($(wc -c < public/.htaccess) byte)" || echo "    TIDAK ADA"
          echo "== 7. SYMLINK storage =="
          ls -la public/storage 2>&1 | head -2 | sed 's/^/    /'
          REMOTE
          )
          SAFE=$(printf '%s' "$OUT" | sed -e "s|$SSH_USER|USER|g" -e "s|$SSH_HOST|HOST|g" -e 's|/home/[^/ ]*|/home/USER|g')
          echo "::warning title=DIAGB64::$(printf '%s' "$SAFE" | base64 -w0)"
